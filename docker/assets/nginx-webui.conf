server {
    listen       8081;
    root         /usr/share/nginx/html;
    index        index.html;

    # Never cache the entry point so new deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Hashed asset files are content-addressed and immutable — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: fall back to index.html so client-side routing (react-router) works
    location / {
        try_files $uri $uri/ /index.html;
    }
}
